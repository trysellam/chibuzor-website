<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Income Leak Diagnostic | The Income Architect</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --charcoal: #242323;
    --charcoal-light: #2e2d2d;
    --charcoal-mid: #3a3939;
    --gold: #C9A551;
    --gold-light: #e0bf7a;
    --gold-dim: #6b5a30;
    --warm-white: #F8F5EF;
    --warm-white-dim: #c8c4bc;
    --warm-white-muted: #7a776f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    min-height: 100%;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--warm-white);
    -webkit-font-smoothing: antialiased;
  }

  .root {
    position: relative;
    min-height: 100vh;
    background: var(--charcoal);
    background-image:
      repeating-linear-gradient(0deg, rgba(201,165,81,0.045) 0px, rgba(201,165,81,0.045) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(201,165,81,0.045) 0px, rgba(201,165,81,0.045) 1px, transparent 1px, transparent 40px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    background: var(--charcoal-light);
    border: 1px solid var(--charcoal-mid);
    border-radius: 4px;
    padding: 48px 44px;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* blueprint corner marks — the signature detail */
  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 1px solid var(--gold-dim);
  }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    font-weight: 500;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.25;
    color: var(--warm-white);
    margin-bottom: 16px;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .lede {
    font-size: 15px;
    color: var(--warm-white-dim);
    line-height: 1.65;
    margin-bottom: 28px;
  }

  .meta-row {
    display: flex;
    gap: 18px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: 11px;
    color: var(--warm-white-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .meta-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold-dim);
  }

  button {
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--gold);
    color: var(--charcoal);
    font-size: 14px;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 3px;
    letter-spacing: 0.01em;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-primary:focus-visible { outline: 2px solid var(--warm-white); outline-offset: 3px; }

  .btn-ghost {
    background: transparent;
    color: var(--warm-white-dim);
    font-size: 13px;
    padding: 10px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn-ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* progress rail */
  .progress-rail {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 36px;
  }
  .progress-seg {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-bar-track {
    height: 2px;
    background: var(--charcoal-mid);
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--gold);
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--warm-white-muted);
    transition: color 0.3s ease;
  }
  .progress-label.active { color: var(--gold); }

  .q-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .q-count {
    font-size: 11px;
    color: var(--warm-white-muted);
  }

  .btn-back {
    background: transparent;
    color: var(--warm-white-muted);
    font-size: 12px;
    padding: 4px 0;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.18s ease;
  }
  .btn-back:hover { color: var(--gold); }
  .btn-back:disabled { opacity: 0.3; cursor: default; }
  .btn-back:disabled:hover { color: var(--warm-white-muted); }
  .btn-back:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .q-pillar {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    font-weight: 500;
  }

  .q-text {
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--warm-white);
    margin-bottom: 28px;
    min-height: 96px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    text-align: left;
    background: var(--charcoal);
    border: 1px solid var(--charcoal-mid);
    border-radius: 3px;
    padding: 16px 18px;
    color: var(--warm-white-dim);
    font-size: 14.5px;
    line-height: 1.5;
    transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
  }
  .option-btn:hover {
    border-color: var(--gold-dim);
    background: var(--charcoal-light);
    color: var(--warm-white);
  }
  .option-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .option-btn.selected {
    border-color: var(--gold);
    background: var(--charcoal-light);
    color: var(--warm-white);
  }

  .fade-swap {
    animation: swapIn 0.35s ease;
  }
  @keyframes swapIn {
    from { opacity: 0; transform: translateX(6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* loading state */
  .loading-wrap {
    text-align: center;
    padding: 30px 0 10px;
  }
  .loading-mark {
    width: 46px;
    height: 46px;
    margin: 0 auto 24px;
    border: 1px solid var(--gold-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 13px;
    color: var(--warm-white-muted);
    letter-spacing: 0.02em;
  }

  /* result screen */
  .leak-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 20px;
    padding: 5px 14px;
    margin-bottom: 20px;
  }

  .result-heading {
    font-family: 'Playfair Display', serif;
    font-size: 27px;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 20px;
  }
  .result-heading .leak-name { color: var(--gold); font-style: italic; }

  .result-body {
    font-size: 15px;
    line-height: 1.75;
    color: var(--warm-white-dim);
    margin-bottom: 12px;
  }

  .result-body.opening {
    color: var(--warm-white);
  }

  .secondary-note {
    font-size: 12.5px;
    color: var(--warm-white-muted);
    line-height: 1.6;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 0.5px solid var(--charcoal-mid);
  }

  .cta-block {
    margin-top: 30px;
    padding-top: 26px;
    border-top: 0.5px solid var(--charcoal-mid);
  }

  .cta-line {
    font-size: 14px;
    color: var(--warm-white-dim);
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .btn-link {
    display: inline-block;
    text-decoration: none;
  }

  .email-block {
    margin-top: 26px;
  }
  .email-label {
    font-size: 12px;
    color: var(--warm-white-muted);
    margin-bottom: 10px;
  }
  .email-row {
    display: flex;
    gap: 8px;
  }
  .email-input {
    flex: 1;
    background: var(--charcoal);
    border: 1px solid var(--charcoal-mid);
    border-radius: 3px;
    padding: 12px 14px;
    color: var(--warm-white);
    font-size: 13.5px;
    font-family: 'DM Sans', sans-serif;
  }
  .email-input:focus-visible, .email-input:focus {
    outline: none;
    border-color: var(--gold-dim);
  }
  .email-input::placeholder { color: var(--warm-white-muted); }

  .btn-send {
    background: var(--charcoal-mid);
    color: var(--warm-white);
    font-size: 13px;
    font-weight: 500;
    padding: 0 20px;
    border-radius: 3px;
    white-space: nowrap;
    transition: background 0.18s ease;
  }
  .btn-send:hover { background: var(--gold-dim); }
  .btn-send:disabled { opacity: 0.5; cursor: default; }

  .email-confirm {
    font-size: 12.5px;
    color: var(--gold);
    margin-top: 10px;
  }

  .restart-row {
    margin-top: 22px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .fade-swap { animation: none; }
    .loading-mark { animation: none; }
    * { transition: none !important; }
  }

  @media (max-width: 520px) {
    .card { padding: 34px 24px; }
    h1 { font-size: 26px; }
    .q-text { font-size: 20px; min-height: 0; }
    .progress-label { font-size: 8.5px; }
    .email-row { flex-direction: column; }
    .btn-send { padding: 13px 20px; }
  }
</style>
</head>
<body>

<div class="root">
  <div class="card" id="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div id="app"></div>
  </div>
</div>

<script>
(function () {

  var BOOKING_URL = "https://calendar.app.google/rXdx7rkYWFb1CNDFA";

  var PILLARS = [
    { key: "offer", label: "Offer" },
    { key: "pricing", label: "Pricing" },
    { key: "visibility", label: "Visibility" },
    { key: "acquisition", label: "Acquisition" }
  ];

  var PILLAR_NAMES = {
    offer: "Offer Architecture",
    pricing: "Pricing Logic",
    visibility: "Financial Visibility",
    acquisition: "Client Acquisition Consistency"
  };

  var QUESTIONS = [
    // Offer Architecture
    { pillar: "offer", text: "How would you describe what you sell, to a stranger?", options: [
      { label: "I have one clear offer I can explain in a sentence.", points: 2 },
      { label: "I have a few offers, but it depends who's asking.", points: 1 },
      { label: "I build something different for almost every client.", points: 0 }
    ]},
    { pillar: "offer", text: "When a client asks for something outside your usual scope, what happens?", options: [
      { label: "I already have a clear yes or no worked out.", points: 2 },
      { label: "I decide case by case, on the spot.", points: 1 },
      { label: "I usually say yes and figure it out afterwards.", points: 0 }
    ]},
    { pillar: "offer", text: "Compared to a year ago, your offer today is:", options: [
      { label: "More defined and structured than it was.", points: 2 },
      { label: "Roughly the same.", points: 1 },
      { label: "Messier, honestly. Harder to explain now.", points: 0 }
    ]},
    // Pricing Logic
    { pillar: "pricing", text: "Where did your last quoted price actually come from?", options: [
      { label: "A calculation tied to the outcome I'd deliver.", points: 2 },
      { label: "A rate I've always charged.", points: 1 },
      { label: "A guess at what the client could afford.", points: 0 }
    ]},
    { pillar: "pricing", text: "Have you raised your prices in the last six months?", options: [
      { label: "Yes, deliberately.", points: 2 },
      { label: "Not really. It's been a while.", points: 1 },
      { label: "No, still charging what I started at.", points: 0 }
    ]},
    { pillar: "pricing", text: "When a client pushes back on price, what do you do?", options: [
      { label: "I have a standard response I trust.", points: 2 },
      { label: "It depends on my mood that day.", points: 1 },
      { label: "I usually just lower it.", points: 0 }
    ]},
    // Financial Visibility
    { pillar: "visibility", text: "Without checking anything, what did you earn last month?", options: [
      { label: "I know the number, to the nearest ₦250,000.", points: 2 },
      { label: "I have a rough idea.", points: 1 },
      { label: "I'd genuinely have to go check.", points: 0 }
    ]},
    { pillar: "visibility", text: "Do you know what it costs you to deliver your core offer, time, tools, everything?", options: [
      { label: "Yes, I've worked it out properly.", points: 2 },
      { label: "I have a rough sense of it.", points: 1 },
      { label: "No, I've never calculated it.", points: 0 }
    ]},
    { pillar: "visibility", text: "If your income stopped tomorrow, how long could you survive on savings?", options: [
      { label: "I know exactly.", points: 2 },
      { label: "I have a rough guess.", points: 1 },
      { label: "I have no idea.", points: 0 }
    ]},
    // Client Acquisition Consistency
    { pillar: "acquisition", text: "In the last three months, how did most of your clients find you?", options: [
      { label: "A specific, repeatable channel I control.", points: 2 },
      { label: "A mix of referrals and one-off luck.", points: 1 },
      { label: "Honestly, I don't know. It just happens.", points: 0 }
    ]},
    { pillar: "acquisition", text: "If your best current client left tomorrow, what's your next step?", options: [
      { label: "A specific plan to replace that income.", points: 2 },
      { label: "I'd start looking, but nothing concrete yet.", points: 1 },
      { label: "I'd be starting from zero.", points: 0 }
    ]},
    { pillar: "acquisition", text: "Does anything bring in leads while you're not actively working?", options: [
      { label: "Yes, content or a system runs without me.", points: 2 },
      { label: "A little, mostly when I'm active.", points: 1 },
      { label: "No, income stops the moment I stop hustling.", points: 0 }
    ]}
  ];

  var RESULT_COPY = {
    offer: "You are still building a new offer every time someone asks. That is not flexibility, it is a leak. Every custom build costs you time you never priced in, and every unclear offer costs you clients who could not tell if you were right for them. Structure removes both costs at once.",
    pricing: "You are pricing on instinct, not on a system. That is not a character flaw, it is the default for anyone who has never had a framework to price against. The cost is not only the money left on individual projects, it is that every quote takes longer than it should because you are negotiating with yourself before you even talk to the client.",
    visibility: "You cannot see your own numbers clearly, and this is the quietest leak of the four because it never announces itself. Without visibility, every pricing decision, every hire, every slow month gets guessed at instead of managed. You cannot fix what you cannot see.",
    acquisition: "Your income depends on hustle that has to restart constantly. A referral or a lucky month is not a system, it is a gap wearing a system's costume. Until client acquisition runs on something repeatable, every month starts from zero."
  };

  var state = {
    screen: "intro",
    current: 0,
    answers: [],
    result: null,
    email: "",
    emailSent: false
  };

  var app = document.getElementById("app");

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function render() {
    app.innerHTML = "";
    if (state.screen === "intro") renderIntro();
    else if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "loading") renderLoading();
    else if (state.screen === "result") renderResult();
  }

  function renderIntro() {
    var eyebrow = el("div", "eyebrow", "For African Professionals");
    var h1 = el("h1", "", "The <em>Income Leak</em> Diagnostic");
    var lede = el("p", "lede", "Every income-earning business has one place where money is quietly slipping away. Twelve questions, structured the way a real diagnosis works. At the end, you'll see exactly where yours is.");

    var meta = el("div", "meta-row");
    meta.appendChild(metaItem("2 minutes"));
    meta.appendChild(metaItem("12 questions"));
    meta.appendChild(metaItem("One clear answer"));

    var btn = el("button", "btn-primary", "Start the diagnostic");
    btn.onclick = function () {
      state.screen = "quiz";
      state.current = 0;
      state.answers = [];
      render();
    };

    app.appendChild(eyebrow);
    app.appendChild(h1);
    app.appendChild(lede);
    app.appendChild(meta);
    app.appendChild(btn);
  }

  function metaItem(text) {
    var wrap = el("div", "meta-item");
    var dot = el("span", "meta-dot");
    wrap.appendChild(dot);
    wrap.appendChild(document.createTextNode(text));
    return wrap;
  }

  function renderQuiz() {
    var q = QUESTIONS[state.current];

    var rail = el("div", "progress-rail");
    PILLARS.forEach(function (p) {
      var segIndexes = QUESTIONS.map(function (qq, i) { return qq.pillar === p.key ? i : -1; }).filter(function (i) { return i >= 0; });
      var answeredInPillar = segIndexes.filter(function (i) { return state.answers[i] !== undefined; }).length;
      var pct = Math.round((answeredInPillar / segIndexes.length) * 100);
      var isActive = q.pillar === p.key;

      var seg = el("div", "progress-seg");
      var label = el("div", "progress-label" + (isActive ? " active" : ""), p.label);
      var track = el("div", "progress-bar-track");
      var fill = el("div", "progress-bar-fill");
      fill.style.width = pct + "%";
      track.appendChild(fill);
      seg.appendChild(track);
      seg.appendChild(label);
      rail.appendChild(seg);
    });

    var topRow = el("div", "q-top-row");
    var backBtn = el("button", "btn-back", "&larr; Back");
    backBtn.disabled = state.current === 0;
    backBtn.onclick = function () {
      if (state.current > 0) {
        state.current -= 1;
        render();
      }
    };
    var qCount = el("div", "q-count", "Question " + (state.current + 1) + " of " + QUESTIONS.length);
    topRow.appendChild(backBtn);
    topRow.appendChild(qCount);

    var qPillar = el("div", "q-pillar", PILLAR_NAMES[q.pillar]);
    var qText = el("div", "q-text fade-swap", q.text);

    var existingAnswer = state.answers[state.current];

    var opts = el("div", "options fade-swap");
    q.options.forEach(function (opt) {
      var isSelected = existingAnswer && existingAnswer.label === opt.label;
      var b = el("button", "option-btn" + (isSelected ? " selected" : ""), opt.label);
      b.onclick = function () {
        state.answers[state.current] = { pillar: q.pillar, label: opt.label, points: opt.points };
        if (state.current < QUESTIONS.length - 1) {
          state.current += 1;
          render();
        } else {
          finishQuiz();
        }
      };
      opts.appendChild(b);
    });

    app.appendChild(rail);
    app.appendChild(topRow);
    app.appendChild(qPillar);
    app.appendChild(qText);
    app.appendChild(opts);
  }

  function renderLoading() {
    var wrap = el("div", "loading-wrap");
    var mark = el("div", "loading-mark");
    var text = el("div", "loading-text", "Reading your answers against the pattern...");
    wrap.appendChild(mark);
    wrap.appendChild(text);
    app.appendChild(wrap);
  }

  function scorePillars() {
    var totals = {};
    PILLARS.forEach(function (p) { totals[p.key] = 0; });
    state.answers.forEach(function (a) { totals[a.pillar] += a.points; });
    var ranked = PILLARS.map(function (p) { return { key: p.key, score: totals[p.key] }; })
      .sort(function (a, b) { return a.score - b.score; });
    return ranked;
  }

  function finishQuiz() {
    state.screen = "loading";
    render();

    var ranked = scorePillars();
    var primary = ranked[0];
    var secondary = ranked[1];
    var hasCloseSecond = (secondary.score - primary.score) <= 1 && secondary.key !== primary.key;

    var pillarAnswers = state.answers.filter(function (a) { return a.pillar === primary.key; })
      .map(function (a) { return "- " + a.label; }).join("\n");

    fetch("/api/diagnostic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        pillarName: PILLAR_NAMES[primary.key],
        pillarAnswers: pillarAnswers
      })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var openingLine = data.opening_line || "";

      state.result = {
        primaryKey: primary.key,
        primaryName: PILLAR_NAMES[primary.key],
        openingLine: openingLine,
        body: RESULT_COPY[primary.key],
        hasCloseSecond: hasCloseSecond,
        secondaryName: hasCloseSecond ? PILLAR_NAMES[secondary.key] : null
      };
      state.screen = "result";
      render();
    })
    .catch(function () {
      state.result = {
        primaryKey: primary.key,
        primaryName: PILLAR_NAMES[primary.key],
        openingLine: "",
        body: RESULT_COPY[primary.key],
        hasCloseSecond: hasCloseSecond,
        secondaryName: hasCloseSecond ? PILLAR_NAMES[secondary.key] : null
      };
      state.screen = "result";
      render();
    });
  }

  function renderResult() {
    var r = state.result;

    var tag = el("div", "leak-tag", "Your Biggest Leak");
    var heading = el("div", "result-heading", r.primaryName + "");
    heading.innerHTML = "Your biggest leak: <span class=\"leak-name\">" + r.primaryName + "</span>";

    app.appendChild(tag);
    app.appendChild(heading);

    if (r.openingLine) {
      var opening = el("p", "result-body opening", r.openingLine);
      app.appendChild(opening);
    }

    var body = el("p", "result-body", r.body);
    app.appendChild(body);

    if (r.hasCloseSecond) {
      var note = el("div", "secondary-note", "Worth knowing: " + r.secondaryName + " is not far behind. When one pillar leaks, the one next to it usually starts to strain too.");
      app.appendChild(note);
    }

    var ctaBlock = el("div", "cta-block");
    var ctaLine = el("p", "cta-line", "This is exactly what The Income Blueprint is built to fix. One session, a clear plan, your next step.");
    var ctaLink = el("a", "btn-link", "");
    ctaLink.href = BOOKING_URL;
    ctaLink.target = "_blank";
    ctaLink.rel = "noopener noreferrer";
    var ctaBtn = el("button", "btn-primary", "Book Your Audit");
    ctaLink.appendChild(ctaBtn);
    ctaBlock.appendChild(ctaLine);
    ctaBlock.appendChild(ctaLink);
    app.appendChild(ctaBlock);

    var emailBlock = el("div", "email-block");
    if (!state.emailSent) {
      var emailLabel = el("div", "email-label", "Want this sent to your inbox?");
      var emailRow = el("div", "email-row");
      var input = el("input", "email-input");
      input.type = "email";
      input.placeholder = "you@email.com";
      input.value = state.email;
      input.oninput = function (e) { state.email = e.target.value; };

      var sendBtn = el("button", "btn-send", "Send it to me");
      sendBtn.onclick = function () {
        if (!state.email || state.email.indexOf("@") === -1) return;
        sendBtn.disabled = true;
        sendBtn.textContent = "Coming soon";
        // NOTE for Chibuzor: this is intentionally disabled for now.
        // Wire this to a real endpoint (Supabase + Resend, same pattern as
        // the Financial OS workflows) before re-enabling the "Saved" state below.
        // Until then, showing a fake success message would tell visitors
        // their result was stored when it genuinely was not.
      };

      emailRow.appendChild(input);
      emailRow.appendChild(sendBtn);
      emailBlock.appendChild(emailLabel);
      emailBlock.appendChild(emailRow);
    } else {
      var confirm = el("div", "email-confirm", "Saved. This result is on file against your email.");
      emailBlock.appendChild(confirm);
    }
    app.appendChild(emailBlock);

    var restartRow = el("div", "restart-row");
    var restartBtn = el("button", "btn-ghost", "Start over");
    restartBtn.onclick = function () {
      state.screen = "intro";
      state.current = 0;
      state.answers = [];
      state.result = null;
      state.email = "";
      state.emailSent = false;
      render();
    };
    restartRow.appendChild(restartBtn);
    app.appendChild(restartRow);
  }

  render();
})();
</script>

</body>
</html>
